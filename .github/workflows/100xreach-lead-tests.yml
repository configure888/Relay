name: 100xReach lead intake tests

on:
  pull_request:
    paths:
      - '100xreach-landing/**'
      - '.github/workflows/100xreach-lead-tests.yml'
  push:
    branches: [main]
    paths:
      - '100xreach-landing/**'

jobs:
  lead-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test 100xReach lead intake
        working-directory: 100xreach-landing
        run: npm test
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned application dependencies
        working-directory: 100xreach-landing
        run: npm install --no-audit --no-fund
      - name: Compile and type-check production build
        working-directory: 100xreach-landing
        run: npm run build
