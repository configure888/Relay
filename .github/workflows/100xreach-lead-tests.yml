name: 100xReach lead intake tests

on:
  pull_request:
    paths:
      - '100xreach-landing/app/api/lead/**'
      - '100xreach-landing/tests/**'
      - '100xreach-landing/package.json'
      - '.github/workflows/100xreach-lead-tests.yml'
  push:
    branches: [main]
    paths:
      - '100xreach-landing/app/api/lead/**'
      - '100xreach-landing/tests/**'
      - '100xreach-landing/package.json'

jobs:
  lead-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test 100xReach lead intake
        working-directory: 100xreach-landing
        run: npm test
